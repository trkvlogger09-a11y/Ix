<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARUN ARMY</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #070d14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Full Screen Green Flash on Click */
        #green-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #10b981;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #green-flash.active {
            opacity: 1;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Image with Premium Rotating Animation */
        .img-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #818cf8, #38bdf8);
            animation: rotateGlow 3s linear infinite;
            filter: blur(4px);
            z-index: 1;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            position: relative;
            width: 124px;
            height: 124px;
            border-radius: 50%;
            object-fit: cover;
            background: #111827;
            z-index: 2;
            border: 3px solid #070d14;
        }

        /* Headline & Members */
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .members {
            font-size: 15px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Feature Badges Row */
        .badges-row {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Join Button */
        .join-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #070d14;
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 15px;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.5);
        }

        .telegram-icon {
            font-size: 18px;
        }

        /* Sub-info */
        .sub-info {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Active Joined Counter */
        .joined-counter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Footer Copyright */
        .footer {
            font-size: 11px;
            color: #475569;
            font-weight: 500;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Green Flash Screen Effect -->
    <div id="green-flash"></div>

    <div class="container">
        <!-- Profile Image with Rotating Animation -->
        <div class="img-container">
            <img src="https://d1yei2z3i6k35z.cloudfront.net/18503587/6abe6112074112.44554605_10076.png" alt="Tarun Army" class="profile-img">
        </div>

        <!-- Headline -->
        <h1>TARUN ARMY</h1>
        <div class="members">30.8K members</div>
        <div class="tagline">JUST CLICK TO CHANGE YOUR LIFE 🚩</div>

        <!-- Badges Row -->
        <div class="badges-row">
            <div class="badge">🔒 Private</div>
            <div class="badge">⚡ Free forever</div>
            <div class="badge">🚀 Instant access</div>
        </div>

        <!-- Join Button -->
        <a href="https://t.me/+S_-EP2gtaNsxOWY1" class="join-btn" onclick="triggerGreen(event)">
            <span class="telegram-icon">✈️</span> Join Channel
        </a>

        <div class="sub-info">Opens in Telegram</div>

        <!-- Joined Counter -->
        <div class="joined-counter">
            <div class="green-dot"></div> 1325 joined in the last 24 hours
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2026 TARUN ARMY · Not affiliated with Telegram
        </div>
    </div>

    <script>
        // Green Screen Flash Effect on Button Click
        function triggerGreen(event) {
            event.preventDefault(); 
            const flash = document.getElementById('green-flash');
            const targetUrl = event.currentTarget.getAttribute('href');
            
            flash.classList.add('active'); // Poori screen green ho jayegi

            setTimeout(() => {
                window.location.href = targetUrl; // Telegram link par redirect
            }, 400);
        }
    </script>

</body>
</html>
